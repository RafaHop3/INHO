name: Deploy API to AWS Lambda

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'infra/**'

# Necessário para o OIDC da AWS funcionar
permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Build, Package and Terraform Apply
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Build Lambda Package
        run: |
          cd backend
          pip install --target ./package -r requirements.txt --upgrade
          cp *.py ./package/
          cp -r core db models routers schemas services ./package/ || true
          cd package
          zip -r ../lambda_package.zip .

      - name: Configure AWS Credentials (Bootstrap)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Bootstrap Terraform State
        run: |
          aws s3api head-bucket --bucket inho-tf-state-orbe-99231 || aws s3api create-bucket --bucket inho-tf-state-orbe-99231 --region us-east-1
          aws dynamodb describe-table --table-name inho-tf-lock-orbe-99231 --region us-east-1 || aws dynamodb create-table --table-name inho-tf-lock-orbe-99231 --attribute-definitions AttributeName=LockID,AttributeType=S --key-schema AttributeName=LockID,KeyType=HASH --billing-mode PAY_PER_REQUEST --region us-east-1

      - name: Terraform Init
        run: terraform init
        working-directory: ./infra

      - name: Debug variables
        run: |
          echo "DATABASE_URL_LEN=${#SECRET_DB}"
          echo "SECRET_KEY_LEN=${#SECRET_SK}"
          echo "FRONTEND_URL_LEN=${#FRONTEND_SECRET}"
          echo "VARS_FRONT=${#VARS_FR}"
        env:
          SECRET_DB: ${{ secrets.DATABASE_URL }}
          SECRET_SK: ${{ secrets.SECRET_KEY }}
          FRONTEND_SECRET: ${{ secrets.FRONTEND_URL }}
          VARS_FR: ${{ vars.FRONTEND_URL }}

      - name: Terraform Apply
        run: terraform apply -auto-approve
        working-directory: ./infra
        env:
          TF_VAR_aws_region: "us-east-1"
          TF_VAR_project_name: "inho"
          TF_VAR_environment: "production"
          TF_VAR_database_url: ${{ secrets.DATABASE_URL }}
          TF_VAR_secret_key: ${{ secrets.SECRET_KEY }}
          TF_VAR_frontend_url: ${{ vars.FRONTEND_URL }}
